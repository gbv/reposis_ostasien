# Project specific configuration for ostasien.
# Only properties that differ from MyCoRe, MIR or reposis_common defaults are listed here.
# Empty values differ between test and production or are confidential and must be set via Ansible inventory.

##############################################################################
# Basic                                                                      #
##############################################################################
# Base URL, e.g. https://domain without trailing '/'
MCR.baseurl=

# Base URL for canonical links on metadata pages, e.g. https://domain/
MIR.CanonicalBaseURL=

MCR.NameOfProject=CrossAsia
MIR.projectid.default=crossasia

##############################################################################
# Email                                                                      #
##############################################################################
MCR.Mail.Server=

# Retry sending mails, MyCoRe tries once
MCR.Mail.NumTries=3

# General sender mail address, e.g. mail@domain
MCR.Mail.Sender=

# Editor mail addresses for messages, e.g. mail@domain0,mail@domain1
MCR.Mail.Address=

# Sender mail for events, e.g. <name> mail@domain
MCR.mir-module.MailSender=

# Mail for events including self registration, e.g. <name> mail@domain
MCR.mir-module.EditorMail=

##############################################################################
# Access Control                                                             #
##############################################################################
# Disable access keys, MIR enables them for mods
MCR.ACL.AccessKey.Strategy.AllowedObjectTypes=

# Evaluate mir_access before state, MIR uses state,mir_access
MIR.Access.Strategy.Classifications=mir_access,state

# Creators may read, edit, view derivates and delete their objects while submitted
MCR.Access.Strategy.CreatorPermissions=read,writedb,view-derivate,deletedb

##############################################################################
# DOI                                                                        #
##############################################################################
MCR.DOI.Prefix=10.82099
MCR.DOI.HostingInstitution=Fachinformationsdienst (FID) Asien

# Service is disabled until Datacite credentials are configured
#MCR.PI.Service.Datacite=org.mycore.pi.doi.MCRDOIService
MCR.PI.Service.Datacite.Transformer=datacite
MCR.PI.Service.Datacite.RegistrationPredicate=org.mycore.pi.condition.MCRPIPublishedPredicate
MCR.PI.Service.Datacite.RegisterBaseURL=%MCR.baseurl%
MCR.PI.Service.Datacite.RegisterURLContext=receive/$ID
MCR.PI.Service.Datacite.Username=
MCR.PI.Service.Datacite.Password=
MCR.PI.Service.Datacite.Generator=crossasiaDOI
MCR.PI.Service.Datacite.MetadataService=MODSDOI

# Only DOIs with own prefix are handled by the metadata service
MCR.PI.MetadataService.MODSDOI.Prefix=%MCR.DOI.Prefix%

# DOIs like 10.82099/20240101-001
MCR.PI.Generator.crossasiaDOI=org.mycore.pi.MCRGenericPIGenerator
MCR.PI.Generator.crossasiaDOI.Type=doi
MCR.PI.Generator.crossasiaDOI.GeneralPattern=%MCR.DOI.Prefix%/$ObjectDate-$Count
MCR.PI.Generator.crossasiaDOI.DateFormat=yyyyMMdd
MCR.PI.Generator.crossasiaDOI.CountPrecision=3

##############################################################################
# URN                                                                        #
##############################################################################
MCR.PI.MetadataService.MODSURN.Prefix=urn:nbn:de:0308

# URNs like urn:nbn:de:0308-20240101-001-<checksum>
MCR.PI.Generator.TypeYearCountURN.GeneralPattern=urn:nbn:de:0308-$ObjectDate-$Count-
MCR.PI.Generator.TypeYearCountURN.DateFormat=yyyyMMdd
MCR.PI.Generator.TypeYearCountURN.CountPrecision=3

##############################################################################
# OAI                                                                        #
##############################################################################
MCR.OAIDataProvider.OAI2.RepositoryName=CrossAsia - Repositorium Ostasien
MCR.OAIDataProvider.OAI2.AdminEmail=
MCR.OAIDataProvider.OAI2.RecordSampleID=%MIR.projectid.default%_mods_00000249

# Keep format, changing it changes all OAI identifiers
MCR.OAIDataProvider.OAI2.RepositoryIdentifier=

MCR.OAIDataProvider.OAI2.DescriptionURI.EPrints=webapp:oai/oai-eprints.xml
MCR.OAIDataProvider.OAI2.DescriptionURI.Rights=webapp:oai/oai-rights.xml

# Do not keep deleted records permanently, MIR uses persistent
MCR.OAIDataProvider.OAI2.DeletedRecord=transient

# Publisher in xMetaDissPlus
MCR.OAIDataProvider.RepositoryPublisherName=
MCR.OAIDataProvider.RepositoryPublisherPlace=
MCR.OAIDataProvider.RepositoryPublisherAddress=

# Offer no marcxml
MCR.OAIDataProvider.OAI2.MetadataFormats=oai_dc,mods,epicur,xMetaDissPlus

# Replace institute set with urn and xmetadissplus sets
MCR.OAIDataProvider.OAI2.Sets=doc-type,open_access,openaire,driver,ec_fundedresources,GENRE,ddc,urn,xmetadissplus
MCR.OAIDataProvider.OAI2.Sets.urn.Query=mods.identifier:urn\\\:nbn\\\:de\\\:0308*

# Published objects with files and own URN for DNB delivery
MCR.OAIDataProvider.OAI2.Sets.xmetadissplus.URI=webapp:oai/set_xmetadissplus.xml
MCR.OAIDataProvider.OAI2.MapSetToQuery.xmetadissplus=derCount:[1 TO *] AND NOT(mods.type:video OR mods.type:research_data OR mods.type:journal OR mods.type:series) AND mods.identifier:urn\\\:nbn\\\:de\\\:0308* AND state:published AND objectType:mods

# Switch to DINI 2022 publication types
MCR.OAIDataProvider.OAI2.Sets.doc-type.Classification=diniPublType2022
MCR.OAIDataProvider.OAI2.Sets.doc-type.URI=xslStyle:classification2sets:classification:metadata:2:children:diniPublType2022
MIR.dc.diniPublType.classificationId=diniPublType2022
MIR.dc.ignoredClassificationIds=diniPublType
MIR.xMetaDissPlus.diniPublType.classificationId=diniPublType2022

# Friendly repositories in OAI Identify
MCR.OAIDataProvider.OAI2.Friends.OpenAgrar=https://openagrar.bmel-forschung.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.DuEPublico=https://duepublico.uni-duisburg-essen.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.DBThueringen=https://www.db-thueringen.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.RosDok=https://rosdok.uni-rostock.de/oai

##############################################################################
# Editor                                                                     #
##############################################################################
MIR.EditorForms.CustomIncludes=%MIR.EditorForms.CustomIncludes%,\
  xslStyle:editor/mir2xeditor:webapp:editor/editor-customization.xed,\
  xslStyle:editor/mir2xeditor:webapp:editor/ostasien-editor-includes.xed

# Batch editor action to change the state of objects
MCR.BatchEditor.servstate.Path2Remove=service/servstates[@class="MCRMetaClassification"]/servstate[@classid="state"][@categid="{0}"]
MCR.BatchEditor.servstate.Path2Add=service/servstates[@class="MCRMetaClassification"]/servstate[@inherited="0"][@classid="state"][@categid="{0}"]

##############################################################################
# Frontend                                                                   #
##############################################################################
MIR.CustomLayout.JS=ostasien.js

# Templates for static pages, e.g. search form on start page
MCR.URIResolver.xslIncludes.MyCoReWebPage=%MCR.URIResolver.xslIncludes.MyCoReWebPage%,ostasien-templates.xsl

# Add DataCite export, EndNote is not offered
MCR.Export.Transformers=bibtex:BibTeX,mods:MODS,marcxml:MARCXML,ris:RIS,isi:ISI,pica3:PICA,mods2csv:CSV,mods2dc:DC,datacite:DataCite

# Citation styles, MIR.citationStyles uses them as well
MCR.Export.CSL.Styles=dependent/asian-anthropology,apa,chicago-author-date,chicago-author-date-de,bibtex,elsevier-harvard,springer-basic-author-date,din-1505-2

# Keep defined order of classifications instead of sorting them alphabetically
MCR.URIResolver.Classification.Sort.mir_licenses=false
MCR.URIResolver.Classification.Sort.mir_filetype=false
MCR.URIResolver.Classification.Sort.noteTypes=false

# ePuSta is disabled until the endpoint is configured
#MIR.ePuSta=show
MIR.ePuSta.providerURL=

##############################################################################
# Enrichment                                                                 #
##############################################################################
# Mail for Unpaywall requests
MIR.OADOI.Mail.Address=
